function bindTranslationDrag(){
  const pop=document.getElementById('translationPopover');
  const handle=pop?.querySelector('.translation-top');
  if(!pop||!handle||!state.translation)return;
  handle.onpointerdown=e=>{
    if(e.button!==0||e.target.closest('button,input,textarea,select,a'))return;
    e.preventDefault();
    const rect=pop.getBoundingClientRect();
    const offsetX=e.clientX-rect.left,offsetY=e.clientY-rect.top;
    const pointerId=e.pointerId;
    pop.classList.add('dragging');
    try{handle.setPointerCapture(pointerId)}catch{}
    const move=ev=>{
      if(ev.pointerId!==pointerId)return;
      const maxX=Math.max(8,window.innerWidth-pop.offsetWidth-8);
      const maxY=Math.max(64,window.innerHeight-Math.min(pop.offsetHeight,window.innerHeight-72)-8);
      const x=Math.min(maxX,Math.max(8,ev.clientX-offsetX));
      const y=Math.min(Math.max(64,window.innerHeight-56),Math.max(64,ev.clientY-offsetY));
      pop.style.left=`${x}px`;
      pop.style.top=`${y}px`;
      state.translation.x=x;
      state.translation.y=y;
    };
    const end=ev=>{
      if(ev.pointerId!==pointerId)return;
      pop.classList.remove('dragging');
      if(state.translation)translationSessionPosition={x:state.translation.x,y:state.translation.y};
      handle.removeEventListener('pointermove',move);
      handle.removeEventListener('pointerup',end);
      handle.removeEventListener('pointercancel',end);
      try{handle.releasePointerCapture(pointerId)}catch{}
    };
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',end);
    handle.addEventListener('pointercancel',end);
  };
}

function saveArticleFromModal(){const title=document.getElementById('titleIn').value.trim(),source=document.getElementById('sourceIn').value.trim(),url=document.getElementById('urlIn').value.trim(),text=document.getElementById('textIn').value;const paragraphs=splitParagraphs(text);if(!title||!paragraphs.length){alert('Please add a title and article text.');return}if(state.modal.mode==='new'){const a={id:`article-${Date.now()}`,title,source:source||'Imported text',url,createdAt:new Date().toISOString().slice(0,10),readingStatus:'To read',status:'To read',progressParagraph:0,revisions:[],paragraphs,annotations:[],expressions:[],review:{mainClaimHtml:'',structureHtml:'',responseHtml:'',updatedAt:null}};state.data.articles.unshift(a);state.modal=null;save();openArticle(a.id);return}const idx=state.data.articles.findIndex(x=>x.id===state.modal.id);if(idx<0)return;const old=state.data.articles[idx];const bodyChanged=JSON.stringify(old.paragraphs)!==JSON.stringify(paragraphs);let nextAnnotations=old.annotations||[],nextExpressions=old.expressions||[],nextProgress=Number(old.progressParagraph)||0;if(bodyChanged){const map=mapUnchangedParagraphs(old.paragraphs||[],paragraphs);nextAnnotations=(old.annotations||[]).filter(x=>map.has(Number(x.paragraphIndex))).map(x=>({...x,paragraphIndex:map.get(Number(x.paragraphIndex))}));nextExpressions=(old.expressions||[]).filter(x=>map.has(Number(x.paragraphIndex))).map(x=>({...x,paragraphIndex:map.get(Number(x.paragraphIndex))}));const kept=nextAnnotations.length+nextExpressions.length,total=(old.annotations||[]).length+(old.expressions||[]).length,dropped=total-kept;if(dropped>0&&!confirm(`This body edit changes paragraph text.\n\n${kept} note/highlight/card item${kept===1?'':'s'} on unchanged paragraphs will be kept. ${dropped} item${dropped===1?'':'s'} tied to changed paragraphs cannot be safely reattached.\n\nA complete previous version will be saved automatically before the edit. Continue?`))return;addArticleRevision(old);if(map.has(nextProgress))nextProgress=map.get(nextProgress);else nextProgress=Math.min(Math.max(0,nextProgress),Math.max(0,paragraphs.length-1))}state.data.articles[idx]={...old,title,source:source||'Imported text',url,paragraphs,annotations:nextAnnotations,expressions:nextExpressions,progressParagraph:nextProgress,readingStatus:normalizeReadingStatus(old.readingStatus||old.status,old),status:normalizeReadingStatus(old.readingStatus||old.status,old)};state.modal=null;save();render();showToast(bodyChanged?'Article updated · previous version saved':'Article details updated')}

function captureSelection(e){
  // Article annotation selection must never intercept selections made inside notes/editors.
  if(e.target.closest('button,.rich-editor,.rich-toolbar,input,textarea,select'))return;
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return hideToolbar();
  const raw=sel.toString();
  if(!raw.trim())return hideToolbar();
  const range=sel.getRangeAt(0);
  const startEl=range.startContainer.nodeType===3?range.startContainer.parentElement:range.startContainer;
  const endEl=range.endContainer.nodeType===3?range.endContainer.parentElement:range.endContainer;
  const startP=startEl?.closest?.('.ptext'),endP=endEl?.closest?.('.ptext');
  // Selection is entirely outside the article text (for example inside a rich-text note): leave it alone.
  if(!startP&&!endP)return;
  // Only article selections that cross paragraph boundaries should trigger this warning.
  if(!startP||!endP||startP!==endP){sel.removeAllRanges();showToast('For now, make one annotation within a single paragraph.');return}
  const pIndex=Number(startP.dataset.ptext);
  const pre=range.cloneRange();pre.selectNodeContents(startP);pre.setEnd(range.startContainer,range.startOffset);
  const start=pre.toString().length;
  const leading=raw.length-raw.trimStart().length;
  const trailing=raw.length-raw.trimEnd().length;
  const s=start+leading,ePos=start+raw.length-trailing;
  if(ePos<=s)return hideToolbar();
  state.translation=null;
  state.selectionDraft={paragraphIndex:pIndex,start:s,end:ePos,quote:raw.trim(),popupX:e.clientX-40,popupY:e.clientY-48};
  const tb=document.getElementById('selectionToolbar');
  if(tb){tb.style.display='flex';const x=Math.min(window.innerWidth-410,Math.max(10,e.clientX-150));const y=Math.max(66,e.clientY-48);tb.style.left=`${x}px`;tb.style.top=`${y}px`}
}
function hideToolbar(){const tb=document.getElementById('selectionToolbar');if(tb)tb.style.display='none'}
function hideHighlightToolbar(){const tb=document.getElementById('highlightEditToolbar');if(tb)tb.style.display='none';state.highlightTargetId=null}
function globalMouseDown(e){const tb=document.getElementById('selectionToolbar');const hb=document.getElementById('highlightEditToolbar');const pop=document.getElementById('translationPopover');if(!e.target.closest('.rich-color-menu'))document.querySelectorAll('.rich-color-menu.open').forEach(x=>x.classList.remove('open'));if(tb&&tb.style.display!=='none'&&!tb.contains(e.target)&&!e.target.closest('.ptext'))hideToolbar();if(hb&&hb.style.display!=='none'&&!hb.contains(e.target)&&!e.target.closest('.annotation-highlight'))hideHighlightToolbar();if(pop&&!pop.contains(e.target)){state.translation=null;state.selectionDraft=null;pop.remove()}if(state.articleMenuOpen&&!e.target.closest('.article-menu-wrap')){state.articleMenuOpen=false;document.getElementById('articleMenu')?.remove()}if(state.librarySettingsOpen&&!e.target.closest('.workspace-menu-wrap')){state.librarySettingsOpen=false;document.getElementById('workspacePanel')?.remove()}if(state.settingsOpen&&!e.target.closest('.settings-wrap')){state.settingsOpen=false;document.getElementById('settingsPanel')?.remove()}}
function chooseHighlightColor(color){const c=normalizeHighlightColor(color);state.data.settings.highlightColor=c;save();document.querySelectorAll('[data-highlight-color]').forEach(x=>x.classList.toggle('active',normalizeHighlightColor(x.dataset.highlightColor)===c));const inp=document.getElementById('selectionHighlightCustom');if(inp)inp.value=c}
function setDraftHighlightColor(color){const c=normalizeHighlightColor(color);const inp=document.getElementById('draftHighlightCustom');if(inp)inp.value=c;if(state.draftNote)state.draftNote.highlightColor=c;document.querySelectorAll('[data-draft-highlight-color]').forEach(x=>x.classList.toggle('active',normalizeHighlightColor(x.dataset.draftHighlightColor)===c));markDraftDirty('note')}
function showHighlightToolbar(e,id){const ann=currentAnnotations().find(x=>x.id===id&&x.showHighlight);if(!ann)return;state.highlightTargetId=id;const tb=document.getElementById('highlightEditToolbar');if(!tb)return;const color=normalizeHighlightColor(ann.highlightColor||state.data.settings.highlightColor);document.querySelectorAll('[data-edit-highlight-color]').forEach(x=>x.classList.toggle('active',normalizeHighlightColor(x.dataset.editHighlightColor)===color));const inp=document.getElementById('editHighlightCustom');if(inp)inp.value=color;tb.style.display='flex';const x=Math.min(window.innerWidth-220,Math.max(10,e.clientX-85));const y=Math.max(66,e.clientY-46);tb.style.left=`${x}px`;tb.style.top=`${y}px`}
function recolorHighlight(id,color){if(!id)return;const c=normalizeHighlightColor(color);state.data.settings.highlightColor=c;updateArticle(a=>{const x=(a.annotations||[]).find(n=>n.id===id);if(x){x.highlightColor=c;x.showHighlight=true}return a},false);state.highlightTargetId=null;render()}
function eraseHighlight(id){if(!id)return;updateArticle(a=>{const x=(a.annotations||[]).find(n=>n.id===id);if(!x)return a;const pure=x.type==='highlight'&&!richHasText(x.noteHtml||x.note||'')&&!x.function&&!x.relation&&!x.target;if(pure)a.annotations=a.annotations.filter(n=>n.id!==id);else x.showHighlight=false;return a},false);if(state.activeAnnId===id)state.activeAnnId=null;state.highlightTargetId=null;showToast('Highlight erased');render()}
function clearAllHighlights(){updateArticle(a=>{a.annotations=(a.annotations||[]).filter(x=>{if(!x.showHighlight)return true;const pure=x.type==='highlight'&&!richHasText(x.noteHtml||x.note||'')&&!x.function&&!x.relation&&!x.target;if(pure)return false;x.showHighlight=false;return true});return a},false);state.activeAnnId=null;state.highlightTargetId=null;showToast('All highlights cleared');render()}
function saveSelectionHighlight(){if(!state.selectionDraft)return;const d=state.selectionDraft;addAnnotation({...d,id:`ann-${Date.now()}-${Math.random()}`,type:'highlight',showHighlight:true,highlightColor:state.data.settings.highlightColor,noteHtml:'',function:'',relation:'',target:'',cardWidth:'half',order:Date.now(),createdAt:Date.now()});state.selectionDraft=null;window.getSelection()?.removeAllRanges();render()}
function startSelectionNote(){if(!state.selectionDraft)return;state.draftNote={articleId:selectedArticle().id,...state.selectionDraft,type:'note',showHighlight:false,highlightColor:state.data.settings.highlightColor,noteHtml:'',function:'',relation:'',target:'',cardWidth:'half',order:Date.now(),createdAt:Date.now(),dirty:false,structureOpen:false};if(state.readerMode==='focus')state.focusExpandedParagraph=state.draftNote.paragraphIndex;state.selectionDraft=null;state.editingAnnId=null;window.getSelection()?.removeAllRanges();render()}
function addAnnotation(ann){updateArticle(a=>{a.annotations.push(ann);return a})}
function editAnnotation(id){const x=currentAnnotations().find(a=>a.id===id);if(!x)return;state.draftNote=structuredClone(x);state.draftNote.articleId=selectedArticle().id;state.draftNote.type='note';state.draftNote.dirty=false;state.draftNote.structureOpen=!!(x.function||x.relation||x.target);state.editingAnnId=id;if(state.readerMode==='focus')state.focusExpandedParagraph=x.paragraphIndex;render()}
function saveDraftNote(){captureLiveDrafts();const d=state.draftNote;if(!d)return;const noteHtml=sanitizeRich(d.noteHtml||'');const next={...d,noteHtml,note:'',function:d.function||'',relation:d.relation||'',target:d.target||'',showHighlight:d.start==null?false:!!d.showHighlight,highlightColor:normalizeHighlightColor(d.highlightColor||state.data.settings.highlightColor),type:'note',cardWidth:d.cardWidth==='full'?'full':'half',order:Number.isFinite(Number(d.order))?Number(d.order):Date.now(),createdAt:d.createdAt||Date.now()};delete next.dirty;delete next.structureOpen;delete next.articleId;const editingId=state.editingAnnId;state.draftNote=null;state.editingAnnId=null;updateArticle(a=>{if(editingId){const idx=a.annotations.findIndex(x=>x.id===editingId);if(idx>=0)a.annotations[idx]=next}else{next.id=`ann-${Date.now()}-${Math.random()}`;a.annotations.push(next)}return a},false);render()}
function deleteAnnotation(id){updateArticle(a=>{a.annotations=a.annotations.filter(x=>x.id!==id);return a},false);if(state.activeAnnId===id)state.activeAnnId=null;if(state.editingAnnId===id){state.editingAnnId=null;state.draftNote=null}render()}
function openAnnotation(id){const x=currentAnnotations().find(a=>a.id===id);if(!x)return;state.activeAnnId=id;render();setTimeout(()=>scrollToAnnotation(x),0)}
function scrollToAnnotation(x){const p=document.querySelector(`[data-paragraph="${x.paragraphIndex}"]`);if(!p)return;p.scrollIntoView({behavior:'smooth',block:'center'});p.classList.add('para-flash');setTimeout(()=>p.classList.remove('para-flash'),1250)}
window.addEventListener('beforeunload',()=>{try{persistReaderProgress()}catch{}});
render();
})();
